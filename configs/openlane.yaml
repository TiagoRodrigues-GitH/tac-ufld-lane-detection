# OpenLane (v1, 2D lanes) template. Adapter checked with synthetic fixtures
# only; run `python -m tac_ufld validate-dataset --dataset openlane` first.
# There is no official UFLD OpenLane setting; these values are a starting
# point (1920x1280 source -> 320x480 keeps the 1.5 aspect ratio).

name: openlane
output_dir: results
device: auto
requires_confirmation: true

data:
  dataset: openlane               # DATASET-SPECIFIC: adapter tac_ufld/data/openlane.py
  root: "${OPENLANE_ROOT}"        # DATASET-SPECIFIC: folder with images/ and lane3d_1000/ (or lane3d_300/)
  img_h: 320                      # DATASET-SPECIFIC: source 1920x1280; no official UFLD setting
  img_w: 480
  num_lanes: 4          # attribute slots: left-left, left, right, right-right
  num_row_anchors: 36             # DATASET-SPECIFIC: starting point, not an official value
  row_anchor_range: [0.40, 0.995]
  griding_num: 100                # DATASET-SPECIFIC: starting point, not an official value
  num_frames: 3
  temporal_step: 1      # 10 Hz: history = t-0.1 s, t-0.2 s
  num_workers: 4
  augmentation:
    # No official UFLD setting for OpenLane: the recipe chosen on ELAS
    # validation (configs/elas.yaml, v0.4). Revisit on OpenLane validation.
    geometric:
      enabled: true
      prob: 0.7
      translate_x: 0.08
      translate_y: 0.05
      scale: [0.9, 1.1]
      rotate_deg: 5.0
      perspective: 0.03
      crop_scale: [0.85, 1.0]
    current_frame_prob: 0.3        # v0.4 recipe: degrade only the current frame of 30 % of clips
  split:
    split_seed: 2026
    val_strategy: sequences   # whole training segments held out for validation
    purge_frames: 2
    val_fraction: 0.1
    seen_test_fraction: 0.0

model:
  # Add v0.4 models as needed (budget!): ufld_baseline_ct, ufld_v06 (aligned),
  # ufld_v07 (recurrent), lite_baseline, lite_v05, lite_v05_static, lite_v06.
  variants: [ufld_baseline, ufld_v02, ufld_v03, ufld_v04]

train:
  seeds: [1, 2, 3, 4, 5, 6]
  epochs: 30
  batch_size: 16
  optimizer: adam
  lr: 4.0e-4
  scheduler: cos

hpo:
  enabled: false
