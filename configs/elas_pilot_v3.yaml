# Third GPU pilot (2026-10-19): every variant of the registry on the pilot-2
# protocol, before the full run.
#
#   python -m tac_ufld run --config configs/elas_pilot_v3.yaml
#
# Differences from configs/elas_pilot_v2.yaml:
# * models: all 19 variants, adding UFLD v0.8 (attention), lite v0.5 static,
#   lite v0.6 occ, lite v0.7, lite TSM + its static control, and the two
#   distilled students (lite_tsm_kd, lite_baseline_kd; teacher = ufld_v07 of
#   this run); the lite head is the fixed anchor-row head (review 2026-10-18);
# * augmentation: a third of the degraded clips (current_frame_prob 0.3)
#   degrade the whole window instead of the current frame only
#   (current_frame_persistent_share 0.33), so a temporal model cannot learn
#   to trust its history blindly (TSM pilot, persistent protocol);
# * Kalman reference: also selects the adaptive measurement noise (default
#   kalman_grid);
# * 1 seed (indicative only: no paired test can reach p < 0.05).
# Same scenes, split, epoch budget (<= 4, patience 2) and no HPO, so the
# numbers are comparable with pilots 1 and 2 and equally indicative.

name: elas_pilot_v3
output_dir: results
device: auto
description: "GPU pilot 3: all 19 variants (TSM, occlusion GRU, distillation), persistent degradation share 0.33, 1 seed, <= 4 epochs, no HPO. Indicative only."

data:
  dataset: elas
  root: "${ELAS_ROOT:-../../datasets/dataset_elas_v1}"
  scenes: [BR_S01, BR_S02, ROD_S03, VIX_S03, VIX_S04, VIX_S05, VIX_S07, VIX_S11, VV_S03, GRI_S01]
  scene_tags:
    BR_S01: {transition: true}
    BR_S02: {transition: true}
    ROD_S03: {rainy: true}
    VIX_S03: {occlusion: true, transition: true}
    VIX_S04: {transition: true}
    VIX_S05: {occlusion: true}
    VIX_S07: {shaky: true, transition: true}
    VIX_S11: {}
    VV_S03: {transition: true}
    GRI_S01: {transition: true}
  img_h: 384
  img_w: 512
  num_lanes: 2
  num_row_anchors: 18
  row_anchor_range: [0.59, 0.995]
  griding_num: 100
  num_frames: 3
  temporal_step: 2
  normalize: imagenet
  num_workers: 4
  augmentation:
    geometric:
      enabled: true
      prob: 0.7
      translate_x: 0.08
      translate_y: 0.05
      scale: [0.9, 1.1]
      rotate_deg: 5.0
      perspective: 0.03
      crop_scale: [0.85, 1.0]
    current_frame_prob: 0.3
    current_frame_persistent_share: 0.33
  split:
    split_seed: 2026
    test_scenes: [BR_S02, VIX_S05, VV_S03]
    block_size: 60
    purge_frames: 10
    val_fraction: 0.2
    seen_test_fraction: 0.15

model:
  variants: [ufld_baseline, ufld_baseline_ct, ufld_v02, ufld_v03, ufld_v04, ufld_v06, ufld_v07, ufld_v08,
             lite_baseline, lite_baseline_ct, lite_v05, lite_v05_static, lite_v06, lite_v06_occ, lite_v07,
             lite_tsm, lite_tsm_static, lite_tsm_kd, lite_baseline_kd]
  pretrained: true

train:
  seeds: [1]
  epochs: 4
  early_stopping_patience: 2

hpo:
  enabled: false

evaluation:
  postprocess_grid:
    threshold: [0.4, 0.5, 0.6]
    min_points: [2, 3]
    poly_degree: [0, 1]
  latency_runs: 30
  n_visual_examples: 8
  visualize_seeds: 1
  tensorboard: true
